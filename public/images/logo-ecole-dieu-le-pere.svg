<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Cercle extérieur -->
  <circle cx="150" cy="150" r="145" fill="white" stroke="#1a73e8" stroke-width="6"/>
  <circle cx="150" cy="150" r="128" fill="none" stroke="#f5b400" stroke-width="3"/>

  <!-- Texte arqué en haut -->
  <path id="texteHaut" d="M 45,150 A 105,105 0 0 1 255,150" fill="none"/>
  <text font-family="Georgia, serif" font-size="13.5" font-weight="700" fill="#1a73e8" letter-spacing="1">
    <textPath href="#texteHaut" startOffset="50%" text-anchor="middle">
      ÉCOLE MATERNELLE ET PRIMAIRE
    </textPath>
  </text>

  <!-- Texte arqué en bas, sens corrigé pour se lire à l'endroit -->
  <path id="texteBas" d="M 45,150 A 105,105 0 0 0 255,150" fill="none"/>
  <text font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a73e8" letter-spacing="1.5">
    <textPath href="#texteBas" startOffset="50%" text-anchor="middle">
      DIEU LE PÈRE
    </textPath>
  </text>

  <!-- Petite croix au-dessus du livre -->
  <g stroke="#f5b400" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="95" x2="150" y2="120"/>
    <line x1="138" y1="103" x2="162" y2="103"/>
  </g>

  <!-- Livre ouvert stylisé -->
  <g>
    <path d="M 100,190 Q 150,170 150,190 L 150,225 Q 150,205 100,222 Z" fill="#1a73e8"/>
    <path d="M 200,190 Q 150,170 150,190 L 150,225 Q 150,205 200,222 Z" fill="#1a73e8"/>
    <line x1="150" y1="190" x2="150" y2="225" stroke="white" stroke-width="2"/>
    <line x1="110" y1="196" x2="140" y2="188" stroke="white" stroke-width="1.5"/>
    <line x1="110" y1="204" x2="140" y2="196" stroke="white" stroke-width="1.5"/>
    <line x1="110" y1="212" x2="140" y2="204" stroke="white" stroke-width="1.5"/>
    <line x1="190" y1="196" x2="160" y2="188" stroke="white" stroke-width="1.5"/>
    <line x1="190" y1="204" x2="160" y2="196" stroke="white" stroke-width="1.5"/>
    <line x1="190" y1="212" x2="160" y2="204" stroke="white" stroke-width="1.5"/>
  </g>

  <!-- Étoiles décoratives -->
  <text x="70" y="160" font-size="14" fill="#f5b400">★</text>
  <text x="222" y="160" font-size="14" fill="#f5b400">★</text>
</svg>
